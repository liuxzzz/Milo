name: milo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-milo}
      POSTGRES_USER: ${POSTGRES_USER:-milo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-milo_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  agent-service:
    build:
      context: .
      target: agent
    init: true
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-milo}
      PGUSER: ${POSTGRES_USER:-milo}
      PGPASSWORD: ${POSTGRES_PASSWORD:-milo_local}
      MASTRA_SCHEMA: ${MASTRA_SCHEMA:-mastra}
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: 4111
    ports:
      - "127.0.0.1:${AGENT_PORT:-4111}:4111"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4111/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    init: true
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
